<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peluche - Seguimiento Seguro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background: #0f172a; color: #f8fafc; }
header { background: #1e293b; color: white; padding: 20px; text-align: center; border-bottom: 1px solid #334155; }
header h1 { margin: 0; font-size: 20px; color: #ff00bf; }
#map { height: calc(100vh - 240px); width: 100%; }
.trip-card { background: #1e293b; padding: 20px; position: relative; z-index: 1000; border-top-left-radius: 16px; border-top-right-radius: 16px; border-top: 1px solid #334155; }
.status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; }
.status-buscando { background: #78350f; color: #fde68a; }
.status-en_curso { background: #14532d; color: #4ade80; }
.status-finalizado { background: #334155; color: #cbd5e1; }
.driver-info { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; border-top: 1px solid #334155; padding-top: 12px; }
.driver-details h3 { margin: 0; font-size: 16px; color: #f8fafc; }
.driver-details p { margin: 2px 0 0 0; font-size: 13px; color: #94a3b8; }
.call-btn { background: #22c55e; color: white; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>Peluche Live Tracking</h1>
</header>

<div id="map"></div>

<div class="trip-card">
  <div id="statusBadge" class="status-badge status-buscando">Cargando viaje...</div>
  <div id="infoDestino" style="font-size: 14px; color: #94a3b8; margin-bottom: 5px;">Destino: Cargando...</div>
  <div id="infoTarifa" style="font-size: 13px; color: #64748b; margin-bottom: 5px;">Tarifa estimada: --</div>
  
  <div class="driver-info">
    <div class="driver-details">
      <h3 id="driverName">Asignando conductor</h3>
      <p id="driverPhone">Espera un momento...</p>
    </div>
    <div id="actionContainer"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const _b64url = "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3ck82Mjl4bURxTHVfZ3BxbXJVN2xJc042Z3JlVkpjMGJhT1hCRGNYMFNBU0k3YzFwbmwzTkRRT2Y4dEVWUFJnSFl4QS9leGVj"; 
const WEB_APP_URL = atob(_b64url);

let map;
let markerOrigen = null;
let markerDriver = null;
let routeLine = null;

const urlParams = new URLSearchParams(window.location.search);
const viajeToken = urlParams.get('token');

window.onload = function() {
  map = L.map('map').setView([13.71053, -89.1847517], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

  if(!viajeToken) {
    mostrarPantallaBloqueada("Enlace No Válido", "Este enlace no contiene un token de seguridad permitido.");
    return;
  }

  obtenerDetallesViaje();
  setInterval(obtenerDetallesViaje, 5000);
};

function obtenerDetallesViaje() {
  fetch(WEB_APP_URL + "?action=obtenerViajePorToken&token=" + viajeToken)
    .then(res => res.json())
    .then(res => {
      if(res.status === 'success' && res.viaje) {
        actualizarInterfaz(res.viaje);
      } else if(res.status === 'expired') {
        mostrarPantallaBloqueada("🔒 Enlace Expirado", res.message);
      } else {
        mostrarPantallaBloqueada("❌ Viaje No Encontrado", "El viaje ya no existe o el token es incorrecto.");
      }
    })
    .catch(err => console.error("Error de sincronización:", err));
}

function mostrarPantallaBloqueada(titulo, mensaje) {
  document.body.innerHTML = `
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#0f172a; color:white; text-align:center; padding:20px;">
      <h2 style="color:#ff00bf; margin-bottom:10px;">${titulo}</h2>
      <p style="color:#94a3b8; max-width:400px;">${mensaje}</p>
    </div>`;
}

function actualizarInterfaz(v) {
  let badge = document.getElementById('statusBadge');
  
  if(v.estado === "BUSCANDO") {
    badge.className = "status-badge status-buscando";
    badge.innerText = "Buscando conductor cercano...";
  } else if(v.estado === "EN_CURSO") {
    badge.className = "status-badge status-en_curso";
    badge.innerText = "¡Conductor en camino!";
  }

  document.getElementById('infoDestino').innerText = "Destino: " + (v.destinoTexto || "No especificado");
  document.getElementById('infoTarifa').innerText = "Tarifa estimada: " + (v.tarifa || "$3.50");
  
  if(v.driverNombre) {
    document.getElementById('driverName').innerText = v.driverNombre;
    document.getElementById('driverPhone').innerText = "Tel: " + (v.driverTelefono || "N/A");
    if(v.driverTelefono) {
      let telLimpio = String(v.driverTelefono).replace(/\D/g, '');
      document.getElementById('actionContainer').innerHTML = `<a href="https://wa.me/${telLimpio}" class="call-btn" target="_blank">💬 Chat Driver</a>`;
    }
  }

  let oLat = parseFloat(v.origenLat);
  let oLng = parseFloat(v.origenLng);

  if(!isNaN(oLat) && !isNaN(oLng) && !markerOrigen) {
    markerOrigen = L.marker([oLat, oLng], {
      icon: L.divIcon({ className: 'origin-icon', html: '<div style="font-size: 24px; text-align: center;">📍</div>', iconSize: [30, 30] })
    }).addTo(map).bindPopup("Tu punto de recogida");
  }

  if(v.driverUbicacion) {
    let coordsDriver = v.driverUbicacion.split(',');
    if(coordsDriver.length === 2) {
      let cLat = parseFloat(coordsDriver[0]);
      let cLng = parseFloat(coordsDriver[1]);

      if(!isNaN(cLat) && !isNaN(cLng)) {
        if(!markerDriver) {
          markerDriver = L.marker([cLat, cLng], {
            icon: L.divIcon({ className: 'driver-icon', html: '<div style="font-size: 30px; text-align: center;">🚗</div>', iconSize: [35, 35], iconAnchor: [17, 17] })
          }).addTo(map).bindPopup("Conductor: " + v.driverNombre);
        } else {
          markerDriver.setLatLng([cLat, cLng]);
        }

        fetch(`https://router.project-osrm.org/route/v1/driving/${cLng},${cLat};${oLng},${oLat}?overview=full&geometries=geojson`)
          .then(response => response.json())
          .then(data => {
            if(data.routes && data.routes.length > 0) {
              let coords = data.routes[0].geometry.coordinates;
              let latLngs = coords.map(c => [c[1], c[0]]);
              if(routeLine) map.removeLayer(routeLine);
              routeLine = L.polyline(latLngs, { color: '#ff00bf', weight: 5, opacity: 0.8 }).addTo(map);
            }
          })
          .catch(err => console.log("Error OSRM"));

        map.fitBounds([[oLat, oLng], [cLat, cLng]], { padding: [60, 60], maxZoom: 16 });
      }
    }
  }
}
</script>
</body>
</html>
