<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peluche</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background: #0f172a; color: #f8fafc; }
header { background: #1e293b; color: white; padding: 20px; text-align: center; border-bottom: 1px solid #334155; }
header h1 { margin: 0; font-size: 20px; color: #ffffff; }
#map { height: calc(100vh - 240px); width: 100%; }
.trip-card { background: #1e293b; padding: 20px; position: relative; z-index: 1000; border-top-left-radius: 16px; border-top-right-radius: 16px; border-top: 1px solid #334155; }
.status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; }
.status-buscando { background: #78350f; color: #fde68a; }
.status-en_curso { background: #14532d; color: #4ade80; }
.status-finalizado { background: #334155; color: #cbd5e1; }
.driver-info { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; border-top: 1px solid #334155; padding-top: 12px; }
.driver-details h3 { margin: 0; font-size: 16px; color: #f8fafc; }
.driver-details p { margin: 2px 0 0 0; font-size: 13px; color: #94a3b8; }
.call-btn { background: #22c55e; color: white; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>Peluche Live Tracking</h1>
</header>

<div id="map"></div>

<div class="trip-card">
  <div id="statusBadge" class="status-badge status-buscando">Cargando viaje...</div>
  <div id="infoDestino" style="font-size: 14px; color: #94a3b8; margin-bottom: 5px;">Destino: Cargando...</div>
  <div id="infoTarifa" style="font-size: 13px; color: #64748b; margin-bottom: 5px;">Tarifa estimada: --</div>
  
  <div class="driver-info">
    <div class="driver-details">
      <h3 id="driverName">Asignando conductor</h3>
      <p id="driverPhone">Espera un momento...</p>
    </div>
    <div id="actionContainer"></div>
  </div>
</div>
